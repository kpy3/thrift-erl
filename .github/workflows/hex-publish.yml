name: Hex publish

# Runs on v-prefixed release tags. Hex releases are immutable (a fix is
# a new version; revert is only possible within a short window after
# publishing), so the tag/version match guard and the test gate run
# before anything is uploaded.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hex-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        # The same toolchain pin the CI workflow tests with; the hex
        # package builds were validated against it locally.
        with:
          otp-version: "28"
          rebar3-version: "3.27"

      - name: Verify the tag matches the application versions
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          vsn="${GITHUB_REF_NAME#v}"
          for app in thrift_runtime thrift_generator rebar3_thrift; do
              declared="$(sed -n 's/.*{vsn, "\([^"]*\)"}.*/\1/p' "apps/$app/src/$app.app.src")"
              if [ "$declared" != "$vsn" ]; then
                  echo "::error::$app declares $declared, the tag says $vsn"
                  exit 1
              fi
          done

      - name: Test gate
        run: |
          rebar3 compile
          rebar3 eunit
          rebar3 ct

      - name: Authenticate to hex.pm
        # rebar3 resolves the publish key from its auth file, not from
        # the environment (no HEX_API_KEY handling anywhere in rebar3,
        # rebar3_hex or hex_core): the file is a single map term keyed
        # by repo name, merged into the repo config at publish time.
        # HEX_API_KEY stays exported for tooling that reads it.
        run: |
          mkdir -p ~/.config/rebar3
          printf '%% coding: utf-8\n#{<<"hexpm">> => #{api_key => <<"%s">>}}.\n' \
              "$HEX_API_KEY" > ~/.config/rebar3/hex.config

      - name: Prepare package directories
        run: scripts/hex-prepublish

      # One package at a time, in dependency order: the plugin's
      # versioned dependency on thrift_generator resolves from hex, so
      # it can only build after the generator's step has succeeded.
      - name: Publish thrift_runtime
        working-directory: apps/thrift_runtime
        run: |
          rebar3 edoc
          rebar3 hex publish -y

      - name: Publish thrift_generator
        working-directory: apps/thrift_generator
        run: |
          rebar3 edoc
          rebar3 hex publish -y

      - name: Publish rebar3_thrift
        working-directory: apps/rebar3_thrift
        run: |
          rebar3 edoc
          rebar3 hex publish -y
