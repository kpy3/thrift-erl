name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["28", "29"]
        include:
          # elp ships per-OTP binaries; the release is pinned to the
          # same build as the local toolchain (no version drift).
          - otp: "28"
            elp_asset: elp-linux-x86_64-unknown-linux-gnu-otp-28.5.tar.gz
          - otp: "29"
            elp_asset: elp-linux-x86_64-unknown-linux-gnu-otp-29.0.tar.gz
    env:
      ELP_RELEASE: "2026-10-05"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: "3.27"
      - name: Compile
        run: rebar3 compile
      - name: Elvis lint
        run: rebar3 lint
      - name: Hank
        run: rebar3 hank
      - name: Xref
        run: rebar3 xref
      - name: Dialyzer
        run: rebar3 dialyzer
      - name: EUnit
        run: rebar3 eunit
      - name: Common Test
        run: rebar3 ct
      - name: Docs thrift_runtime (ex_doc)
        # Dry-run of what `rebar3 hex publish` runs per package.
        # rebar3_thrift is absent on purpose: its standalone build
        # resolves thrift_generator from hex, which becomes possible
        # only after that package's first publish.
        working-directory: apps/thrift_runtime
        run: rebar3 ex_doc
      - name: Docs thrift_generator (ex_doc)
        working-directory: apps/thrift_generator
        run: rebar3 ex_doc
      - name: Coverage report
        run: rebar3 cover
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: cover-${{ matrix.otp }}
          path: _build/test/cover/
      - name: Install elp
        run: |
          curl -fsSL -o /tmp/elp.tar.gz \
            "https://github.com/whatsapp/erlang-language-platform/releases/download/${ELP_RELEASE}/${{ matrix.elp_asset }}"
          tar -xzf /tmp/elp.tar.gz -C /usr/local/bin
          elp version
      - name: ELP lint
        # The gate wrapper (fails on findings at warning severity or
        # above; raw elp lint always exits 0) runs with --no-connect —
        # the same deterministic standalone mode CI always used.
        run: scripts/lint-elp
